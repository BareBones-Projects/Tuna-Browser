name: Pull request validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax checks
        run: npm run check
      - name: Navigation guard syntax
        run: node --check src/navigation-guard.js
      - name: Unit tests
        run: npm test
