<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuna Browser</title><link rel="stylesheet" href="ui.css"></head>
<body class="browser-chrome"><header class="top"><div class="brand">◉ <span>TUNA</span></div><div class="tab-strip" data-tabs role="tablist" aria-label="Browser tabs"></div><button class="new-tab" data-new-tab aria-label="New tab">+</button><div class="window-space"></div></header>
<nav class="toolbar" aria-label="Browser controls"><button data-back aria-label="Back" title="Back">←</button><button data-forward aria-label="Forward" title="Forward">→</button><button data-reload aria-label="Reload" title="Reload">⟳</button><form data-address-form><span class="lock" aria-hidden="true">◆</span><input data-address aria-label="Search or enter HTTPS address" autocomplete="off" spellcheck="false" placeholder="Search or enter HTTPS address"><button class="go" type="submit">Go</button></form><button data-new-tab-secondary aria-label="New tab" title="New tab">＋</button></nav>
<div class="message" data-status role="status" aria-live="polite">New tab · HTTPS pages only</div><script src="renderer.js"></script></body></html>
