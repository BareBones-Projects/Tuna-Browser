<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuna Browser</title><link rel="stylesheet" href="ui.css"></head>
<body class="browser-chrome"><header class="top"><div class="brand">◉ <span>TUNA</span></div><div class="menu-anchor"><button data-menu-toggle="app" aria-expanded="false" aria-label="Application menu">☰</button><div class="popup-menu" data-menu="app" hidden><button data-command="new-tab">New tab</button><button data-command="bookmark">Bookmark this page</button><button data-command="preferences">Preferences</button><button data-command="reload">Reload</button></div></div><div class="tab-strip" data-tabs role="tablist" aria-label="Browser tabs"></div><button class="new-tab" data-new-tab aria-label="New tab">+</button><div class="window-space"></div><div class="menu-anchor"><button data-menu-toggle="edit" aria-expanded="false">Edit</button><div class="popup-menu" data-menu="edit" hidden><button data-command="focus-address">Edit address</button><button data-command="copy-url">Copy page URL</button><button data-command="bookmark">Add bookmark</button></div></div><div class="menu-anchor"><button data-menu-toggle="system" aria-expanded="false">System ▾</button><div class="popup-menu menu-right" data-menu="system" hidden><button data-command="preferences">System preferences</button><button data-command="extensions">Extensions</button><button data-command="devtools">Developer frame</button><button data-command="reload">Reload page</button></div></div></header>
<nav class="toolbar" aria-label="Browser controls"><button data-back aria-label="Back" title="Back">←</button><button data-forward aria-label="Forward" title="Forward">→</button><button data-reload aria-label="Reload" title="Reload">⟳</button><form data-address-form><span class="lock" aria-hidden="true">◆</span><input data-address aria-label="Search or enter HTTPS address" autocomplete="off" spellcheck="false" placeholder="Search or enter HTTPS address"><button class="go" type="submit">Go</button></form><button data-new-tab-secondary aria-label="New tab" title="New tab">＋</button></nav>
<div class="bookmarks-bar" data-bookmarks-bar aria-label="Bookmarks bar"><button data-bookmark-current title="Bookmark current page">☆</button><div data-bookmarks></div></div><div class="message" data-status role="status" aria-live="polite">New tab · HTTPS pages only</div><aside class="settings-panel" data-settings hidden aria-label="Browser preferences"><div class="settings-heading"><strong data-settings-title>System preferences</strong><button data-settings-close aria-label="Close preferences">×</button></div><div data-preferences-view><label>Wallpaper image URL<input data-wallpaper placeholder="https://example.com/wallpaper.jpg"></label><label>Bottom-right link text<input data-link-text placeholder="Your custom text"></label><label>Bottom-right link URL<input data-link-url placeholder="https://example.com"></label><label class="settings-check"><input type="checkbox" data-show-bookmarks checked> Show bookmarks bar</label><button data-save-settings>Save preferences</button></div><div data-extensions-view hidden><p data-extensions-list>No extensions installed.</p><p>Extension installation and management are not enabled in this alpha.</p></div></aside><script src="renderer.js"></script></body></html>
